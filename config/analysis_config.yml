# Validated defaults for the complete drone-radar analysis.
metadata_file: metadata/flights.csv
expected_number_of_flights: 85
projected_crs: 32611

outputs:
  positional_figures: output/positional_deviation
  detection_figures: output/detection_rate
  detection_qc: output/detection_rate_qc

positional_deviation:
  results_file: derived_data/positional_deviation_results.rds
  radar_y_offsets_m:
    "9090": 20
    "7360": 0

detection_rate:
  results_file: derived_data/detection_rate_results.rds
  cone_of_silence_m:
    "9090": 300
    "7360": 150
  bin_widths_seconds: [1, 2, 3, 4, 5]
  shifted_bin_fraction: 0.5
  drone_evaluation_step_seconds: 0.1
