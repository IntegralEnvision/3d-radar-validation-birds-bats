name: repository-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install check dependency
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'
      - name: Run structural checks
        run: Rscript scripts/check_repository.R
